    <script type="module">
      import { mountSoundToggle } from "./audio.ts";
      import { mount } from "./book-nav.ts";
      import { isChapterComplete } from "./lesson-progress.ts";

      mount("contents-2", document.querySelector("#book-nav"));
      mountSoundToggle(document.querySelector("#sound-toggle"));

      for (const id of ["illegal-moves", "ko", "scoring"]) {
        if (!isChapterComplete(id)) continue;
        const status = document.querySelector(`[data-status-for="${id}"]`);
        if (!status) continue;
        status.textContent = "✓";
        status.classList.add("chapter-done");
        status.setAttribute("aria-label", "Completed");
      }
    </script>
