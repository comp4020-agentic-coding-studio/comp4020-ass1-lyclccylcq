<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn Go: an interactive rulebook</title>
    <link rel="stylesheet" href="./styles.css" />
    <script>
      (function () {
        try {
          var turn = sessionStorage.getItem("learn-go:page-turn");
          if (turn) {
            document.documentElement.setAttribute("data-turn", turn);
            sessionStorage.removeItem("learn-go:page-turn");
          }
        } catch (error) {
          // sessionStorage unavailable: falls back to the default transition.
        }
      })();
    </script>
  </head>
  <body>
    <div class="table-scene" aria-hidden="true">
      <div class="table-scene-surface"></div>
      <div class="table-board">
        <svg class="table-board-grid" viewBox="0 0 100 100" preserveAspectRatio="none">
          <line x1="5" y1="5" x2="5" y2="95" />
          <line x1="15" y1="5" x2="15" y2="95" />
          <line x1="25" y1="5" x2="25" y2="95" />
          <line x1="35" y1="5" x2="35" y2="95" />
          <line x1="45" y1="5" x2="45" y2="95" />
          <line x1="55" y1="5" x2="55" y2="95" />
          <line x1="65" y1="5" x2="65" y2="95" />
          <line x1="75" y1="5" x2="75" y2="95" />
          <line x1="85" y1="5" x2="85" y2="95" />
          <line x1="95" y1="5" x2="95" y2="95" />
          <line x1="5" y1="5" x2="95" y2="5" />
          <line x1="5" y1="15" x2="95" y2="15" />
          <line x1="5" y1="25" x2="95" y2="25" />
          <line x1="5" y1="35" x2="95" y2="35" />
          <line x1="5" y1="45" x2="95" y2="45" />
          <line x1="5" y1="55" x2="95" y2="55" />
          <line x1="5" y1="65" x2="95" y2="65" />
          <line x1="5" y1="75" x2="95" y2="75" />
          <line x1="5" y1="85" x2="95" y2="85" />
          <line x1="5" y1="95" x2="95" y2="95" />
          <circle cx="25" cy="25" r="1.1" />
          <circle cx="75" cy="25" r="1.1" />
          <circle cx="50" cy="50" r="1.1" />
          <circle cx="25" cy="75" r="1.1" />
          <circle cx="75" cy="75" r="1.1" />
        </svg>
      </div>
      <svg class="table-bowl table-bowl-white" viewBox="0 0 100 70">
        <defs>
          <radialGradient id="bowlWoodWhite" cx="35%" cy="25%" r="80%">
            <stop offset="0%" stop-color="#7a4f2a" />
            <stop offset="100%" stop-color="#43290f" />
          </radialGradient>
          <radialGradient id="stoneWhiteGrad" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#fffdf6" />
            <stop offset="100%" stop-color="#d8cfb6" />
          </radialGradient>
        </defs>
        <ellipse cx="50" cy="40" rx="46" ry="26" fill="url(#bowlWoodWhite)" />
        <ellipse cx="50" cy="34" rx="38" ry="19" fill="#2a1a0d" opacity="0.4" />
        <circle cx="38" cy="30" r="8" fill="url(#stoneWhiteGrad)" />
        <circle cx="53" cy="26" r="8" fill="url(#stoneWhiteGrad)" />
        <circle cx="46" cy="36" r="8" fill="url(#stoneWhiteGrad)" />
        <circle cx="61" cy="33" r="8" fill="url(#stoneWhiteGrad)" />
      </svg>
      <svg class="table-bowl table-bowl-black" viewBox="0 0 100 70">
        <defs>
          <radialGradient id="bowlWoodBlack" cx="35%" cy="25%" r="80%">
            <stop offset="0%" stop-color="#6b4526" />
            <stop offset="100%" stop-color="#3a230d" />
          </radialGradient>
          <radialGradient id="stoneBlackGrad" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#4a4a4a" />
            <stop offset="100%" stop-color="#0a0a0a" />
          </radialGradient>
        </defs>
        <ellipse cx="50" cy="40" rx="46" ry="26" fill="url(#bowlWoodBlack)" />
        <ellipse cx="50" cy="34" rx="38" ry="19" fill="#000" opacity="0.35" />
        <circle cx="40" cy="29" r="8" fill="url(#stoneBlackGrad)" />
        <circle cx="55" cy="25" r="8" fill="url(#stoneBlackGrad)" />
        <circle cx="48" cy="37" r="8" fill="url(#stoneBlackGrad)" />
        <circle cx="63" cy="33" r="8" fill="url(#stoneBlackGrad)" />
        <circle cx="34" cy="40" r="8" fill="url(#stoneBlackGrad)" />
      </svg>
    </div>
    <main class="cover">
      <h1 class="visually-hidden">Learn Go</h1>
      <nav aria-label="Primary">
        <a class="cover-enter" href="./contents.html">
          <span class="cover-book" aria-hidden="true">
            <svg
              class="cover-book-art"
              viewBox="0 0 300 420"
              preserveAspectRatio="none"
            >
              <defs>
                <filter id="ink-brush" x="-20%" y="-60%" width="140%" height="220%">
                  <feTurbulence type="fractalNoise" baseFrequency="0.05 0.4" numOctaves="2" seed="6" result="noise" />
                  <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
                </filter>
              </defs>
              <rect class="cover-book-spine" x="0" y="0" width="34" height="420" />
              <g class="cover-book-thread">
                <line x1="17" y1="45" x2="17" y2="360" />
                <circle cx="17" cy="60" r="3" />
                <circle cx="17" cy="130" r="3" />
                <circle cx="17" cy="200" r="3" />
                <circle cx="17" cy="270" r="3" />
                <circle cx="17" cy="340" r="3" />
              </g>
              <!-- A single small kifu fragment — a printed game-record insert,
                   not a board-wide grid (§2). -->
              <g class="cover-kifu" transform="rotate(-3 90 324)">
                <line class="cover-kifu-grid" x1="54" y1="288" x2="54" y2="360" />
                <line class="cover-kifu-grid" x1="72" y1="288" x2="72" y2="360" />
                <line class="cover-kifu-grid" x1="90" y1="288" x2="90" y2="360" />
                <line class="cover-kifu-grid" x1="108" y1="288" x2="108" y2="360" />
                <line class="cover-kifu-grid" x1="126" y1="288" x2="126" y2="360" />
                <line class="cover-kifu-grid" x1="54" y1="288" x2="126" y2="288" />
                <line class="cover-kifu-grid" x1="54" y1="306" x2="126" y2="306" />
                <line class="cover-kifu-grid" x1="54" y1="324" x2="126" y2="324" />
                <line class="cover-kifu-grid" x1="54" y1="342" x2="126" y2="342" />
                <line class="cover-kifu-grid" x1="54" y1="360" x2="126" y2="360" />
                <g class="cover-kifu-stone">
                  <circle cx="72" cy="306" r="6.5" />
                </g>
                <g class="cover-kifu-stone">
                  <circle cx="90" cy="306" r="6.5" />
                  <text x="90" y="306" dominant-baseline="central" text-anchor="middle">一</text>
                </g>
                <g class="cover-kifu-stone">
                  <circle cx="90" cy="324" r="6.5" />
                </g>
                <g class="cover-kifu-stone">
                  <circle cx="108" cy="342" r="6.5" />
                  <text x="108" y="342" dominant-baseline="central" text-anchor="middle">二</text>
                </g>
                <g class="cover-kifu-stone">
                  <circle cx="72" cy="342" r="6.5" />
                </g>
              </g>
            </svg>
            <span class="cover-book-label">
              <span class="cover-book-label-text">Learn Go</span>
            </span>
          </span>
          <span class="cover-enter-text">Open the book</span>
        </a>
      </nav>
    </main>
    <script>
      (function () {
        var link = document.querySelector(".cover-enter");
        if (!link) return;
        link.addEventListener("click", function () {
          try {
            sessionStorage.setItem("learn-go:page-turn", "open");
          } catch (error) {
            // sessionStorage unavailable: falls back to the default transition.
          }
        });
      })();
    </script>
  </body>
</html>
