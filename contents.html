<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contents — Learn Go</title>
    <link rel="stylesheet" href="./styles.css" />
    <script>
      (function () {
        try {
          var turn = sessionStorage.getItem("learn-go:page-turn");
          if (turn) {
            document.documentElement.setAttribute("data-turn", turn);
            sessionStorage.removeItem("learn-go:page-turn");
          }
        } catch (error) {
          // sessionStorage unavailable: falls back to the default transition.
        }
      })();
    </script>
  </head>
  <body>
    <div class="table-scene" aria-hidden="true">
      <div class="table-scene-surface"></div>
      <div class="table-board">

          <circle cx="75" cy="75" r="1.1" />

      </div>
      <svg class="table-bowl table-bowl-white" viewBox="0 0 100 70">

          </radialGradient>
        </defs>
        <ellipse cx="50" cy="40" rx="46" ry="26" fill="url(#bowlWoodWhite)" />
        <ellipse cx="50" cy="34" rx="38" ry="19" fill="#2a1a0d" opacity="0.4" />
        <circle cx="38" cy="30" r="8" fill="url(#stoneWhiteGrad)" />
        <circle cx="53" cy="26" r="8" fill="url(#stoneWhiteGrad)" />
        <circle cx="46" cy="36" r="8" fill="url(#stoneWhiteGrad)" />

    </div>
    <header>
      <nav aria-label="Primary">
        <a href="./">Close the book</a>
        <a href="./contents.html">Contents</a>
      </nav>
    </header>
    <main class="book-open-shell">
      <div class="book-open leaf">
        <div class="book-open-heading">
          <p class="chapter-kicker">目录</p>
          <h1>Contents</h1>
        </div>
        <ol class="contents-list">
          <li class="contents-prologue">
            <div class="contents-entry">
              <span class="chapter-kicker">序章</span>
              <a href="./prologue.html">About this book</a>
            </div>
          </li>
          <li>
            <div class="contents-entry">
              <span class="chapter-kicker">第一章 · 着子</span>
              <a href="./lessons/placing-stones.html">1. Placing a stone</a>
            </div>
          </li>
          <li>
            <div class="contents-entry">
              <span class="chapter-kicker">第二章 · 气</span>
              <a href="./lessons/liberties-and-capture.html">2. Liberties and capture</a>
            </div>
            <span data-status-for="liberties-and-capture"></span>
          </li>
          <li>
            <div class="contents-entry">
              <span class="chapter-kicker">第三章 · 棋块</span>
              <a href="./lessons/connected-groups.html">3. Connected groups</a>
            </div>
            <span data-status-for="connected-groups"></span>
          </li>
          <li>
            <div class="contents-entry">
              <span class="chapter-kicker">第四章 · 禁着</span>
              <a href="./lessons/illegal-moves.html">4. Illegal moves: suicide</a>
            </div>
            <span data-status-for="illegal-moves"></span>
          </li>
          <li>
            <div class="contents-entry">
              <span class="chapter-kicker">第五章 · 劫</span>
              <a href="./lessons/ko.html">5. Ko</a>
            </div>
            <span data-status-for="ko"></span>
          </li>
          <li>
            <div class="contents-entry">
              <span class="chapter-kicker">第六章 · 数子</span>
              <a href="./lessons/scoring.html">6. Winning the game</a>
            </div>
            <span data-status-for="scoring"></span>
          </li>
          <li>
            <span>Free play</span>
            <span class="lesson-status">Coming soon</span>
          </li>
        </ol>
      </div>
    </main>
    <script type="module">
      import { isChapterComplete } from "./lesson-progress.ts";

      for (const id of ["liberties-and-capture", "connected-groups", "illegal-moves", "ko", "scoring"]) {
        if (!isChapterComplete(id)) continue;
        const status = document.querySelector(`[data-status-for="${id}"]`);
        if (!status) continue;
        status.textContent = "✓";
        status.classList.add("chapter-done");
        status.setAttribute("aria-label", "Completed");
      }
    </script>
  </body>
</html>
